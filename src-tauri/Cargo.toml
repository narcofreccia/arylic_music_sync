[package]
name = "music-sync"
version = "0.1.0"
description = "MusicSync — Arylic LP10 LAN multiroom controller"
authors = ["MusicSync"]
edition = "2021"
rust-version = "1.77"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (Windows linker issue).
name = "music_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-updater = "2.10"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
futures-util = "0.3"

# Luci control protocol (LibreWireless) — TCP 7777 + TLS 1.2, mutual auth with an
# embedded client cert. The device's own cert is self-signed and not validated
# (a dangerous verifier accepts it), matching the LSCommunicator SDK.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# Discovery: DDMS M-SEARCH / SSDP + subnet-sweep CIDR maths.
ipnet = "2"

# Local profile auth (FR-1): Argon2 password hash, no cloud account server.
argon2 = "0.5"
rand = "0.8"

log = "0.4"
