[package]
name = "music-sync"
version = "0.1.0"
description = "MusicSync — Arylic LP10 LAN multiroom controller"
authors = ["MusicSync"]
edition = "2021"
# 1.82: the codebase uses `Option::is_none_or` (discovery.rs), stable since 1.82.
rust-version = "1.82"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin (Windows linker issue).
name = "music_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-updater = "2.10"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

# Luci control protocol (LibreWireless) — TCP 7777 + TLS 1.2, mutual auth with an
# embedded client cert. The device's own cert is self-signed and not validated
# (a dangerous verifier accepts it), matching the LSCommunicator SDK.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# Discovery: DDMS M-SEARCH / SSDP + subnet-sweep CIDR maths.
ipnet = "2"

# Local profile auth (FR-1): Argon2 password hash, no cloud account server.
argon2 = "0.5"
# Pulls rand_core's `getrandom` feature so argon2's OsRng salt source resolves.
rand = "0.8"

log = "0.4"

# --- Phase S3: Spotify capture via librespot (in-process Connect endpoint) ---
# BUILD PIN (see docs/STREAMING-design.md §7): librespot-core 0.8.0's build script
# uses `vergen-gitcl 1.0.8`, which pulls BOTH `vergen 9.1.0` (→ vergen-lib 9.1.0)
# and `vergen-lib 0.1.6` directly, so its build.rs fails to compile with an E0277
# trait-mismatch on Rust 1.93. Fix: pin `vergen` to 9.0.6 (the last release still on
# vergen-lib 0.1.x), which collapses the graph to a single vergen-lib 0.1.6. The pin
# lives in Cargo.lock (applied via `cargo update -p vergen --precise 9.0.6`); do NOT
# run `cargo update -p vergen` past 9.0.x or the build blocker returns.

# librespot is an unofficial, reverse-engineered Spotify client (Spotify ToS gray
# area) and requires a Spotify **Premium** account. We embed it in-process and feed
# decoded PCM to the S2 streaming engine via a custom audio-backend Sink (see
# src/spotify/). `default-features = false` drops native-tls + the rodio audio
# backend (we never play to a local device); we select rustls to match the app's
# existing rustls/ring TLS stack, and libmdns for pure-Rust zeroconf advertising.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots", "with-libmdns"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Poll the librespot zeroconf discovery Stream (yields Spotify Credentials).
futures-util = { version = "0.3", default-features = false }
